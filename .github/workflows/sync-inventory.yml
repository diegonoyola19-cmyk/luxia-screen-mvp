name: Scheduled Inventory Sync

on:
  workflow_dispatch:

jobs:
  sync-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Sync Endpoint
        run: |
          echo "Triggering LUXIA inventory sync..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "https://luxia-screen-mvp.vercel.app/api/cron/sync-inventory")
          echo "$RESPONSE"
